# rohy release pipeline (Phase 16).
#
# Produces all six platform/architecture artefacts from ONE orchestrated run, plus a single
# checksum manifest covering them. Triggered by pushing a version tag; the workflow only
# ever CONSUMES a tag, it never creates one.
#
# Host strategy is dictated by what each target actually needs, which was measured rather
# than assumed
#
#   windows/amd64 + windows/arm64 -> one Windows runner. Wails on Windows uses the pure-Go
#     WebView2 loader, so no cgo is involved and arm64 cross-builds from an amd64 host.
#   linux/amd64, linux/arm64      -> native runners each. The GTK4 / WebKitGTK 6.0 frontend
#     is cgo, so it needs the target's headers and toolchain.
#   darwin/amd64 + darwin/arm64   -> one macOS runner. The WKWebView frontend is cgo, but
#     Xcode targets both architectures from either host.
#
# Two guarantees are inherited from build.ps1 / build.sh and must not be weakened here:
#   1. The frontend is rebuilt from scratch every time. The Go binary embeds whatever is in
#      frontend/dist, so a stale dist ships an old UI behind a new backend. dist is deleted
#      before every build and is NEVER cached.
#   2. Version metadata is injected at link time and reflects reality, including marking a
#      dirty tree, so an artefact can always say exactly what it was built from.
#
# Every build is the Taskfile (Taskfile.yml, build/<os>/), run by the Wails v3 CLI with the
# identity passed as task variables: wails3 task -f <os>:build ARCH= VERSION= COMMIT= DATE=

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        # No default, deliberately. The version lives in README.md and nowhere else; a default
        # here is a second copy, and a pre-filled box is the easiest way to ship the previous
        # release by accident.
        description: "SemVer to stamp, without the leading v (the version README.md states)"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  WAILS_VERSION: "v3.1.0"

jobs:
  # ---------------------------------------------------------------------------------
  # Resolve the version once, so every artefact in the release reports the same identity.
  # ---------------------------------------------------------------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------------
  # Windows: both architectures from one runner (no cgo on this platform).
  # ---------------------------------------------------------------------------------
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history so the commit stamp is real

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Backend tests
        run: go test ./backend/...

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      # 🔒 Each architecture is PACKAGED inside the loop, before the next iteration starts.
      #
      # Both architectures write bin/rohy.exe, so a binary left sitting there is overwritten by
      # the next architecture's build. That is exactly how the v0.2.0 release broke: both
      # binaries built successfully, and packaging then could not find the first one.
      #
      # dist is deleted, and -f reruns the frontend's tasks, on every iteration: that is what
      # guarantees the embedded frontend is rebuilt from scratch rather than carried over from the
      # previous architecture.
      - name: Build and package windows/amd64 and windows/arm64
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          if [ -n "$(git status --porcelain)" ]; then COMMIT="${COMMIT}-dirty"; fi
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          V=${{ needs.version.outputs.version }}
          mkdir -p dist
          for arch in amd64 arm64; do
            rm -rf frontend/dist bin
            wails3 task -f windows:build "ARCH=${arch}" "VERSION=${V}" "COMMIT=${COMMIT}" "DATE=${DATE}"
            # Proves the frontend was rebuilt for THIS architecture, not carried over.
            test -f frontend/dist/index.html
            # Copied out so the archive holds rohy.exe at its root, not under bin/.
            cp bin/rohy.exe rohy.exe
            7z a -tzip "dist/rohy_${V}_windows_${arch}.zip" rohy.exe LICENSE README.md >/dev/null
            rm rohy.exe
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: rohy-win
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------
  # Linux: one native runner per architecture — the GTK/WebKit frontend is cgo.
  # ---------------------------------------------------------------------------------
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # GTK4 and WebKitGTK 6.0, the Linux frontend Wails v3 binds by default; 24.04 is the
      # first Ubuntu LTS that ships both. The artefact needs the same two libraries at run time,
      # which the README states as the requirement.
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Backend tests
        run: go test ./backend/...

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Clean frontend build
        run: rm -rf frontend/dist

      - name: Build linux/${{ matrix.arch }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          if [ -n "$(git status --porcelain)" ]; then COMMIT="${COMMIT}-dirty"; fi
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          wails3 task -f linux:build "ARCH=${{ matrix.arch }}" \
            "VERSION=${{ needs.version.outputs.version }}" "COMMIT=${COMMIT}" "DATE=${DATE}"
          test -f frontend/dist/index.html

      - name: Package
        run: |
          set -euo pipefail
          V=${{ needs.version.outputs.version }}
          mkdir -p dist
          cp LICENSE README.md bin/
          tar -czf "dist/rohy_${V}_linux_${{ matrix.arch }}.tar.gz" -C bin rohy LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: rohy-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------
  # macOS: both architectures from one runner — Xcode targets either from either host.
  # ---------------------------------------------------------------------------------
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Backend tests
        run: go test ./backend/...

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      # The package task builds the binary and assembles bin/rohy.app around it.
      - name: Build darwin/amd64 and darwin/arm64
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          if [ -n "$(git status --porcelain)" ]; then COMMIT="${COMMIT}-dirty"; fi
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          V=${{ needs.version.outputs.version }}
          mkdir -p dist
          for arch in amd64 arm64; do
            rm -rf frontend/dist bin
            wails3 task -f darwin:package "ARCH=${arch}" "VERSION=${V}" "COMMIT=${COMMIT}" "DATE=${DATE}"
            test -f frontend/dist/index.html
            # macOS ships a .app bundle; zip preserves the bundle structure, the executable
            # bit and the signature, which a plain tar of the binary would lose.
            ditto -c -k --keepParent bin/rohy.app "dist/rohy_${V}_darwin_${arch}.zip"
          done

      # Only an ad-hoc signature is applied (the package task's codesign --sign -), and the
      # bundle is not notarized. Gatekeeper blocks it until the user clears it explicitly, and
      # that is stated in the release notes rather than left as a surprise. Real signing needs an
      # Apple Developer identity and notarization credentials in repository secrets; until those
      # exist, degrading loudly beats pretending the artefact is signed.
      - name: Note signing status
        run: echo "::warning::macOS artefacts are ad-hoc signed only and not notarized; Gatekeeper will require manual approval."

      - uses: actions/upload-artifact@v4
        with:
          name: rohy-macos
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------------
  # Release: all-or-nothing. A partial matrix must never publish a partial release, so this
  # job depends on every build job and GitHub will skip it if any of them failed.
  # ---------------------------------------------------------------------------------
  release:
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # The repository is needed here, not just the artefacts: the release body is assembled from
      # RELEASE_NOTES.md below. Without this the notes step has no file to read.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      - name: Verify the full matrix arrived
        run: |
          set -euo pipefail
          cd staged
          ls -la
          missing=0
          for f in \
            "windows_amd64.zip" "windows_arm64.zip" \
            "linux_amd64.tar.gz" "linux_arm64.tar.gz" \
            "darwin_amd64.zip" "darwin_arm64.zip"; do
            if ! ls *"$f" >/dev/null 2>&1; then echo "MISSING: *$f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "refusing to publish an incomplete release"; exit 1; }

      # The manifest the README already instructs users to verify against.
      - name: Generate SHA256SUMS.txt
        run: |
          cd staged
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The notes are written by hand in RELEASE_NOTES.md, and the section for THIS version is
      # extracted here — so the released body and the file in the repository cannot say different
      # things. Without it the action replaces whatever is on the release with a short generated
      # body, which silently destroys notes somebody wrote in the web UI.
      #
      # Failing when the section is missing is deliberate. Publishing a release whose notes are an
      # empty string is worse than not publishing at all, because the gap is only discovered by
      # whoever downloads it.
      - name: Assemble release notes
        run: |
          set -euo pipefail
          V="${{ needs.version.outputs.version }}"
          awk -v ver="## v$V" '
            $0 ~ "^"ver" " || $0 == ver {found=1}
            found && /^## v/ && $0 !~ "^"ver {exit}
            found {print}
          ' RELEASE_NOTES.md > notes.md
          if [ ! -s notes.md ]; then
            echo "RELEASE_NOTES.md has no '## v$V' section - write the notes before tagging" >&2
            exit 1
          fi
          cat .github/release-footer.md >> notes.md
          wc -c notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          # body_path, not body: the source is the file in the repository, so the release cannot
          # drift from it. append_body is left off, so a re-run REPLACES the body rather than
          # stacking a second copy of the footer on top of the first.
          body_path: notes.md
          generate_release_notes: true
