version: '3'

# rohy's build, run with the Wails CLI: `wails3 build`, `wails3 package`, `wails3 dev`.
# A release stamps its identity (backend/version) through the task runner, which passes
# variables on; each is added to the linker flags only when given:
#   wails3 task build VERSION=0.3.0 COMMIT=$(git rev-parse --short HEAD) DATE=2026-11-16T00:00:00Z

vars:
  APP_NAME: "rohy"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "npm"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS; `wails3 build GOOS=...`
  # overrides it. The tasks below dispatch to the matching platform Taskfile.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
